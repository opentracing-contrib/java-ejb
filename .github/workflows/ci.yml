name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Submit dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5
        if: github.event_name != 'pull_request'

  deploy-snapshot:
    name: Deploy snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Deploy snapshot to GitHub Packages
        run: mvn --batch-mode --update-snapshots deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    name: Create/Update release notes
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Create/Update Draft
        uses: lucacome/draft-release@v2.2.1
        with:
          minor-label: "enhancement"
          major-label: "change"
          publish: ${{ github.ref_type == 'tag' }}
          collapse-after: 50

  publish:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, release-notes]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Publish release to GitHub Packages
        run: mvn --batch-mode deploy -Prelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
